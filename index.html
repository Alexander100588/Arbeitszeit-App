<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Arbeitszeit</title><style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827;margin:auto;max-width:720px;padding:18px 14px 40px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0}.hero{text-align:center;padding:22px}.hero b{font-size:22px}.muted{color:#6b7280}button{border:0;border-radius:14px;padding:15px 12px;font-size:16px;font-weight:700;width:100%;background:#e5e7eb}.start{background:#166534;color:#fff}.main{background:#111827;color:#fff}.end{background:#fee2e2;color:#991b1b}.add{background:#e0e7ff;color:#312e81}.hidden{display:none}input,textarea,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #d1d5db;border-radius:12px;margin:7px 0 10px}textarea{min-height:72px}.row{display:flex;gap:8px}.row>*{flex:1}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{width:auto;padding:9px;font-size:14px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f9fafb;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px}.entry{border-left:3px solid #d1d5db;padding:4px 8px 15px 15px}.time{font-weight:800}.meta{font-size:13px;margin-top:6px}.meta button{width:auto;padding:0;background:none;text-decoration:underline;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}label{font-size:13px;color:#6b7280}
</style></head><body><h1>Arbeitszeit</h1><div id="date" class="muted"></div><div class="card hero"><b id="state">Bereit für den Arbeitstag</b><div id="where" class="muted"></div></div><div class="card actions"><button id="primary" class="start wide">▶ Arbeit starten</button><button id="finish" class="end hidden">■ Arbeit beenden</button><button id="add" class="add">＋ Nachtragen</button></div>
<div id="live" class="card hidden"><b id="liveTitle"></b><div id="recent" class="chips"></div><input id="place" placeholder="Einsatzort"><textarea id="note" placeholder="Was wurde gemacht? (optional)"></textarea><div class="row"><button class="cancel">Abbrechen</button><button id="liveSave" class="main">Speichern</button></div></div>
<div id="manual" class="card hidden"><b id="manualTitle">Eintrag nachtragen</b><label>Art</label><select id="type"><option>Arbeitsbeginn</option><option>Ortswechsel</option><option>Arbeitsende</option></select><label>Datum</label><input id="mdate" type="date"><label>Uhrzeit</label><input id="mtime" type="time"><div id="placeWrap"><label>Einsatzort</label><div id="mrecent" class="chips"></div><input id="mplace" placeholder="Einsatzort"></div><label>Notiz</label><textarea id="mnote" placeholder="Tätigkeit / Bemerkung"></textarea><div class="row"><button class="cancel">Abbrechen</button><button id="manualSave" class="main">Speichern</button></div></div>
<div id="endbox" class="card hidden"><b>Arbeitstag beenden</b><textarea id="endnote" placeholder="Abschlussnotiz (optional)"></textarea><div class="row"><button class="cancel">Abbrechen</button><button id="endSave" class="end">Feierabend speichern</button></div></div>
<div class="card summary"><div class="metric"><span class="muted">Beginn heute</span><b id="begin">–</b></div><div class="metric"><span class="muted">Arbeitszeit</span><b id="duration">–</b></div></div><div class="card"><h2>Heute</h2><div id="entries"></div></div><div class="card"><div class="row"><button id="csv">CSV exportieren</button><button id="reset">Daten löschen</button></div></div>
<script>
const K='arbeitszeit_v3';let d={entries:[],recentPlaces:[],working:false,currentPlace:''};try{d=JSON.parse(localStorage.getItem(K))||d}catch(e){};d.entries=d.entries||[];d.recentPlaces=d.recentPlaces||[];const $=x=>document.getElementById(x),now=()=>new Date(),sv=z=>z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0'),tm=z=>z.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),save=()=>localStorage.setItem(K,JSON.stringify(d));$('date').textContent=now().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
function close(){['live','manual','endbox'].forEach(x=>$(x).classList.add('hidden'))}document.querySelectorAll('.cancel').forEach(x=>x.onclick=close);
function chips(id,input){let c=$(id);c.innerHTML='';d.recentPlaces.slice(0,8).forEach(p=>{let b=document.createElement('button');b.className='chip';b.textContent=p;b.onclick=()=>$(input).value=p;c.appendChild(b)})}
function remember(p){if(p)d.recentPlaces=[p,...d.recentPlaces.filter(x=>x!==p)].slice(0,15)}
function recalc(){let a=[...d.entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts)),last=a.at(-1);d.working=!!last&&last.type!=='Arbeitsende';let p=a.filter(e=>e.text&&(e.type==='Arbeitsbeginn'||e.type==='Ortswechsel'));d.currentPlace=p.length?p.at(-1).text:'';save()}
function add(type,text,note,z){d.entries.push({id:Date.now()+Math.floor(Math.random()*999),type,text:text||'',note:note||'',ts:z.toISOString()});d.entries.sort((a,b)=>new Date(b.ts)-new Date(a.ts));recalc();render()}
$('primary').onclick=()=>{close();$('liveTitle').textContent=d.working?'Wohin wechselst du?':'Wo startest du heute?';chips('recent','place');$('live').classList.remove('hidden')};$('liveSave').onclick=()=>{let p=$('place').value.trim();if(!p)return alert('Bitte Einsatzort angeben.');remember(p);let t=d.working?'Ortswechsel':'Arbeitsbeginn';let n=$('note').value.trim();$('place').value='';$('note').value='';close();add(t,p,n,now())};$('finish').onclick=()=>{close();$('endbox').classList.remove('hidden')};$('endSave').onclick=()=>{let n=$('endnote').value.trim();$('endnote').value='';close();add('Arbeitsende','',n,now())};
function toggle(){$('placeWrap').classList.toggle('hidden',$('type').value==='Arbeitsende')}$('type').onchange=toggle;
$('add').onclick=()=>{close();$('manualTitle').textContent='Eintrag nachtragen';$('manualSave').dataset.edit='';$('type').value=d.working?'Ortswechsel':'Arbeitsbeginn';$('mdate').value=sv(now());$('mtime').value=tm(now());$('mplace').value='';$('mnote').value='';chips('mrecent','mplace');toggle();$('manual').classList.remove('hidden')};
$('manualSave').onclick=()=>{let t=$('type').value,p=$('mplace').value.trim(),n=$('mnote').value.trim(),z=new Date($('mdate').value+'T'+$('mtime').value+':00');if(isNaN(z))return alert('Datum/Uhrzeit prüfen.');if(t!=='Arbeitsende'&&!p)return alert('Einsatzort angeben.');remember(p);let id=$('manualSave').dataset.edit;if(id){let e=d.entries.find(x=>String(x.id)===id);e.type=t;e.text=t==='Arbeitsende'?'':p;e.note=n;e.ts=z.toISOString();d.entries.sort((a,b)=>new Date(b.ts)-new Date(a.ts));recalc();close();render()}else{close();add(t,t==='Arbeitsende'?'':p,n,z)}};
function edit(id){let e=d.entries.find(x=>x.id===id),z=new Date(e.ts);close();$('manualTitle').textContent='Eintrag bearbeiten';$('manualSave').dataset.edit=String(id);$('type').value=e.type;$('mdate').value=sv(z);$('mtime').value=tm(z);$('mplace').value=e.text;$('mnote').value=e.note||'';chips('mrecent','mplace');toggle();$('manual').classList.remove('hidden')}
function today(){return d.entries.filter(e=>sv(new Date(e.ts))===sv(now()))}function start(){return today().filter(e=>e.type==='Arbeitsbeginn').sort((a,b)=>new Date(a.ts)-new Date(b.ts))[0]}function end(){return today().filter(e=>e.type==='Arbeitsende').sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0]}function dur(){let s=start();if(!s)return'–';let z=d.working?now():(end()?new Date(end().ts):null);if(!z)return'–';let m=Math.max(0,Math.floor((z-new Date(s.ts))/60000));return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'}
function render(){recalc();$('state').textContent=d.working?'Arbeit läuft':'Bereit für den Arbeitstag';$('where').textContent=d.working?'Aktuell: '+(d.currentPlace||'–'):'Noch nicht gestartet / beendet';$('primary').textContent=d.working?'📍 Standort wechseln':'▶ Arbeit starten';$('primary').className=d.working?'main wide':'start wide';$('finish').classList.toggle('hidden',!d.working);let s=start();$('begin').textContent=s?tm(new Date(s.ts)):'–';$('duration').textContent=dur();let b=$('entries');b.innerHTML='';let a=today().sort((x,y)=>new Date(x.ts)-new Date(y.ts));if(!a.length)b.innerHTML='<span class="muted">Noch keine Einträge.</span>';a.forEach(e=>{let x=document.createElement('div');x.className='entry';let i=e.type==='Arbeitsbeginn'?'🟢':e.type==='Arbeitsende'?'🔴':'📍';x.innerHTML='<span class="time">'+tm(new Date(e.ts))+'</span> <b>'+i+' '+e.type+'</b>'+(e.text?' · '+e.text:'')+(e.note?'<div>↳ '+e.note+'</div>':'')+'<div class="meta"><button>Bearbeiten</button> · <button>Löschen</button></div>';let bs=x.querySelectorAll('button');bs[0].onclick=()=>edit(e.id);bs[1].onclick=()=>{if(confirm('Eintrag löschen?')){d.entries=d.entries.filter(q=>q.id!==e.id);recalc();render()}};b.appendChild(x)})}
$('reset').onclick=()=>{if(confirm('Alle V3-Daten löschen?')){d={entries:[],recentPlaces:[],working:false,currentPlace:''};save();render()}};$('csv').onclick=()=>{let r=[['Datum','Uhrzeit','Typ','Ort','Notiz'],...d.entries.slice().reverse().map(e=>{let z=new Date(e.ts);return[z.toLocaleDateString('de-DE'),tm(z),e.type,e.text,e.note]})],c=r.map(x=>x.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download='arbeitszeit.csv';a.click()};render();setInterval(()=>{if(d.working)$('duration').textContent=dur()},60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
