<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Arbeitszeit</title>
<style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827;margin:auto;max-width:700px;padding:18px 14px}h1{margin:4px 0}.muted{color:#6b7280}.card{background:white;border-radius:18px;padding:16px;margin:12px 0}.hero{text-align:center;padding:22px}.hero b{font-size:22px}.hero div{margin-top:7px}button{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;width:100%}.start{background:#166534;color:white}.main{background:#111827;color:white}.end{background:#fee2e2;color:#991b1b;margin-top:10px}.hidden{display:none}input,textarea{width:100%;font:inherit;font-size:16px;padding:13px;border:1px solid #d1d5db;border-radius:12px;margin:8px 0}textarea{min-height:75px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{width:auto;padding:9px 11px;background:#eef2ff;font-size:14px}.row{display:flex;gap:8px}.row button{flex:1}.small{font-size:14px;padding:11px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f9fafb;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px;margin-top:4px}.entry{border-left:3px solid #d1d5db;padding:3px 8px 15px 15px;margin-left:5px}.time{font-weight:800}.note{margin-top:5px}.meta{font-size:13px;color:#6b7280;margin-top:5px}a{color:#4b5563}</style></head><body>
<h1>Arbeitszeit</h1><div id="date" class="muted"></div>
<div class="card hero"><b id="state">Bereit für den Arbeitstag</b><div id="where" class="muted">Noch nicht gestartet</div></div>
<div class="card"><button id="primary" class="start">▶ Arbeit starten</button><button id="finish" class="end hidden">■ Arbeit beenden</button></div>
<div id="form" class="card hidden"><b id="formTitle"></b><div id="recent" class="chips"></div><input id="place" placeholder="Einsatzort"><textarea id="note" placeholder="Was machst du dort? (optional)"></textarea><div class="row"><button id="cancel" class="small">Abbrechen</button><button id="save" class="small main">Speichern</button></div></div>
<div id="endForm" class="card hidden"><b>Arbeitstag beenden</b><textarea id="endNote" placeholder="Abschlussnotiz (optional)"></textarea><div class="row"><button id="endCancel" class="small">Abbrechen</button><button id="endSave" class="small end" style="margin:0">Feierabend speichern</button></div></div>
<div class="card summary"><div class="metric"><span class="muted">Beginn heute</span><b id="begin">–</b></div><div class="metric"><span class="muted">Zeit seit Beginn</span><b id="duration">–</b></div></div>
<div class="card"><h2>Heute</h2><div id="entries"></div></div>
<script>
const KEY='arbeitszeit_v1';let d;try{d=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){d={}};d.entries=Array.isArray(d.entries)?d.entries:[];d.recentPlaces=Array.isArray(d.recentPlaces)?d.recentPlaces:[];d.working=!!d.working;d.currentPlace=d.currentPlace||'';
const $=x=>document.getElementById(x),save=()=>localStorage.setItem(KEY,JSON.stringify(d)),now=()=>new Date(),day=x=>x.toLocaleDateString('sv-SE'),tm=x=>x.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),today=()=>d.entries.filter(e=>day(new Date(e.ts))===day(now()));
$('date').textContent=now().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
function close(){ $('form').classList.add('hidden');$('endForm').classList.add('hidden') }
function chips(){let c=$('recent');c.innerHTML='';d.recentPlaces.slice(0,6).forEach(p=>{let b=document.createElement('button');b.className='chip';b.textContent=p;b.onclick=()=>{$('place').value=p};c.appendChild(b)})}
$('primary').onclick=()=>{close();$('formTitle').textContent=d.working?'Wohin wechselst du?':'Wo startest du heute?';$('save').textContent=d.working?'Ortswechsel speichern':'Arbeit starten';chips();$('form').classList.remove('hidden');$('place').focus()};
$('cancel').onclick=close;$('endCancel').onclick=close;
$('finish').onclick=()=>{close();$('endForm').classList.remove('hidden')};
$('save').onclick=()=>{let p=$('place').value.trim(),n=$('note').value.trim();if(!p){alert('Bitte einen Einsatzort auswählen oder eingeben.');return}d.currentPlace=p;d.recentPlaces=[p,...d.recentPlaces.filter(x=>x!==p)].slice(0,12);let type=d.working?'Ortswechsel':'Arbeitsbeginn';d.working=true;d.entries.unshift({id:Date.now(),type,text:p,note:n,ts:now().toISOString()});$('place').value='';$('note').value='';save();close();render()};
$('endSave').onclick=()=>{d.working=false;d.entries.unshift({id:Date.now(),type:'Arbeitsende',text:'',note:$('endNote').value.trim(),ts:now().toISOString()});$('endNote').value='';save();close();render()};
function start(){return today().filter(e=>e.type==='Arbeitsbeginn').sort((a,b)=>new Date(a.ts)-new Date(b.ts))[0]}
function end(){return today().filter(e=>e.type==='Arbeitsende').sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0]}
function dur(){let s=start();if(!s)return'–';let z=d.working?now():(end()?new Date(end().ts):null);if(!z)return'–';let m=Math.max(0,Math.floor((z-new Date(s.ts))/60000));return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'}
function render(){ $('state').textContent=d.working?'Arbeit läuft':'Bereit für den Arbeitstag';$('where').textContent=d.working?'Aktuell: '+(d.currentPlace||'–'):'Noch nicht gestartet / bereits beendet';$('primary').textContent=d.working?'📍 Standort wechseln':'▶ Arbeit starten';$('primary').className=d.working?'main':'start';$('finish').classList.toggle('hidden',!d.working);let s=start();$('begin').textContent=s?tm(new Date(s.ts)):'–';$('duration').textContent=dur();let b=$('entries');b.innerHTML='';let a=today();if(!a.length){b.innerHTML='<span class="muted">Noch keine Einträge. Starte oben deinen Arbeitstag.</span>';return}a.forEach(e=>{let x=document.createElement('div');x.className='entry';let icon=e.type==='Arbeitsbeginn'?'🟢':e.type==='Arbeitsende'?'🔴':'📍';x.innerHTML='<span class="time">'+tm(new Date(e.ts))+'</span> <b>'+icon+' '+e.type+'</b>'+(e.text?' · '+e.text:'')+(e.note?'<div class="note">↳ '+e.note+'</div>':'')+'<div class="meta"><a href="#">Löschen</a></div>';x.querySelector('a').onclick=ev=>{ev.preventDefault();if(confirm('Eintrag löschen?')){d.entries=d.entries.filter(q=>q.id!==e.id);save();render()}};b.appendChild(x)})}
render();setInterval(()=>{if(d.working)$('duration').textContent=dur()},60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
